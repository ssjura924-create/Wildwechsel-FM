name: Wildwechsel FM - Folge produzieren
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = Stimmtest; episode = echte Folge mit eigenen Assets'
        type: choice
        options:
          - preview
          - episode
        default: preview
      narration:
        description: 'Moderation, kurze Sätze durch | trennen'
        type: string
        default: 'Moin, hier ist Ralle von Wildwechsel FM!|Wir suchen die Geheimnisse von Vice City.|Nicht einfach Gas geben, Bruder. Augen auf!'
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install piper-tts
      - name: Get German neural voice
        run: |
          mkdir -p models
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx
          curl --fail --location --retry 3 --max-time 180 "$base" -o models/voice.onnx
          curl --fail --location --retry 3 --max-time 180 "$base.json" -o models/voice.onnx.json
      - name: Render narrated video
        env:
          NARRATION: ${{ inputs.narration }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          printf '%s\n' "$NARRATION" | tr '|' '\n' > inputs/narration.txt
          args=(--script inputs/narration.txt --model models/voice.onnx)
          if [[ "$MODE" == "preview" ]]; then
            args+=(--preview)
          else
            args+=(--gameplay inputs/gameplay.mp4)
            if [[ -f inputs/ralle.webm ]]; then
              args+=(--ralle inputs/ralle.webm)
            else
              args+=(--ralle inputs/ralle.png)
            fi
          fi
          python produce.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: wildwechsel-folge
          path: output/
          if-no-files-found: error
          retention-days: 7
